# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
project_id = "product-lifecycle"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# Auth is enforced inside the functions (requireManageUsers). Gateway JWT
# verify blocks browser OPTIONS preflight (no Authorization) → CORS errors.
[functions.invite-user]
verify_jwt = false

[functions.delete-user]
verify_jwt = false

[functions.resend-invite]
verify_jwt = false

[functions.list-auth-status]
verify_jwt = false

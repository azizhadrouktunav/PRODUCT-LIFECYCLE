# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
project_id = "product-lifecycle"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# Authentication is our own (app_users + app_sessions), so no Supabase JWT ever
# reaches these functions. Admin endpoints enforce access themselves through
# requirePermission() in functions/_shared/auth.ts.
[functions.auth-login]
verify_jwt = false

[functions.auth-session]
verify_jwt = false

[functions.auth-logout]
verify_jwt = false

[functions.auth-set-password]
verify_jwt = false

[functions.invite-user]
verify_jwt = false

[functions.delete-user]
verify_jwt = false

[functions.resend-invite]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

[functions.set-user-activation]
verify_jwt = false

[functions.register-user]
verify_jwt = false

[functions.verify-email]
verify_jwt = false
